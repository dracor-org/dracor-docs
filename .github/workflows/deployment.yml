name: Deployment

# Deploys doc/ with rsync over SSH. Each GitHub environment has its own
# DEPLOY_KEY, which the server restricts to rsync into the docs directory (see
# dracor-org-deployment), so the destination path is relative to it.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      host:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to ${{ inputs.host }}
        env:
          HOST: ${{ inputs.host }}
        run: |
          rsync -rlvz --delete \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes' \
            doc/ \
            "github@$HOST:/"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
